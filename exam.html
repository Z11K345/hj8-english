<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="data:,">
<title>在线做题 · 沪教八上英语</title>
<style>
:root{
  /* 纸感中性色：暖白底 + 墨黑字 + 暖发丝线。冷灰蓝的底色最像「后台管理系统」，换成带暖调的纸色更接近教辅印刷品 */
  --bg:#f4f2ed; --card:#fff;
  --primary:#1d4a6b; --primary-soft:#eef2f5; --primary-line:#c9d6e0; --primary-dark:#153a52;
  --text:#1a1d21; --muted:#6d7580; --border:#dedad2;
  --ok:#1c6b45; --ok-soft:#eaf3ee; --bad:#9e2f26; --bad-soft:#fbecea; --na:#8a5a18; --na-soft:#faf4e8;
  /* 强调色只留一支赭石，专给「要点／注意」用：原来蓝+绿+橙三色并列，是典型的模板味 */
  --accent:#8a5a18;
  --radius:3px;   /* 统一小圆角：接近印刷品的直角，比大圆角稳重 */
  /* 字体体系：界面用无衬线，阅读正文用衬线（印刷/课本感，指标更稳） */
  --font-ui:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-read:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,"Times New Roman",serif;
  --font-en:Georgia,"Times New Roman","Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",serif;
  --ink:#1a1d21; --ink-soft:#596069; --rule:#dedad2;
}
/* 数字统一等宽：页码、题数、计时、进度都不跳字，是「正规资料」的细节信号 */
.tnum,#timer,#countdown,.know-prog,.kb-n,.kb-foot,.au-time{font-variant-numeric:tabular-nums;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  background:var(--bg); color:var(--text); line-height:1.7; font-size:16px;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--card);
  border-bottom:1px solid var(--border); padding:6px 12px;
  box-shadow:0 1px 6px rgba(0,0,0,.04);
  display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center;
}
.controls{display:flex; flex-wrap:wrap; gap:7px; align-items:center;}
.controls label{font-size:13px; color:var(--muted); margin-right:2px;}
.topbar-status{display:flex; align-items:center; gap:12px; margin-left:auto; flex-wrap:wrap;}
#examStatus{display:flex; align-items:center; gap:10px;}
select{
  font-family:inherit; font-size:14px; padding:6px 9px; border:1px solid var(--border);
  border-radius:var(--radius); background:#fff; color:var(--text); max-width:44vw;
}
select:focus{outline:none; border-color:var(--primary);}
.wrap{max-width:1040px; margin:0 auto; padding:8px 12px 16px;}
@media(min-width:641px){
  .wrap{max-width:1600px; padding:8px 14px 10px;}
}
#paperTitle{font-size:13.5px; font-weight:700; color:var(--primary); margin:0;}
#summary{
  display:none; margin:10px 0 14px; padding:12px 16px; border-radius:var(--radius);
  background:var(--primary-soft); border:1px solid var(--primary-line); font-size:15px;
}
#summary b{color:var(--primary); font-size:20px;}
.summary-row{display:flex; gap:18px; flex-wrap:wrap; align-items:center;}
.summary-row .stat{display:flex; flex-direction:column;}
.summary-row .stat span{font-size:12px; color:var(--muted);}
.summary-row .stat b{font-size:18px; color:var(--text);}
.filterbar{display:none; margin:8px 0; font-size:14px; color:var(--muted);}
.filterbar label{cursor:pointer; user-select:none;}

.qcard{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.qhead{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.qno{
  flex:0 0 auto; background:var(--primary); color:#fff; font-size:13px; font-weight:700;
  min-width:30px; height:24px; padding:0 8px; border-radius:var(--radius); display:flex; align-items:center; justify-content:center;
}
.stem{font-size:16px; white-space:pre-wrap; word-break:break-word; margin:2px 0 12px;}
.opts{display:flex; flex-direction:column; gap:8px;}
.opt{
  display:flex; align-items:flex-start; gap:10px; padding:9px 12px; border:1.5px solid var(--border);
  border-radius:var(--radius); cursor:pointer; transition:background .12s, border-color .12s;
}
.opt:hover{background:var(--bg);}
.opt input{position:absolute; opacity:0; width:0; height:0;}
.opt .ltr{
  flex:0 0 auto; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--muted);
}
.opt .otext{white-space:pre-wrap; word-break:break-word; flex:1 1 auto;}
.opt.chosen{border-color:var(--primary);}
.opt.chosen .ltr{border-color:var(--primary); color:var(--primary);}
.opt.correct{border-color:var(--ok); background:var(--ok-soft);}
.opt.correct .ltr{background:var(--ok); border-color:var(--ok); color:#fff;}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft);}
.opt.wrong .ltr{background:var(--bad); border-color:var(--bad); color:#fff;}
.opt.disabled{cursor:default;}
.result{display:none; margin-top:12px; padding:8px 12px; border-radius:var(--radius); font-size:14.5px; font-weight:600;}
.result.ok{background:var(--ok-soft); color:var(--ok);}
.result.bad{background:var(--bad-soft); color:var(--bad);}
.result.na{background:var(--na-soft); color:var(--na);}
.expl{display:none; margin-top:8px; padding:10px 13px; background:var(--bg); border-left:3px solid var(--primary);
  border-radius:0 var(--radius) var(--radius) 0; font-size:14px; color:var(--ink-soft); white-space:pre-wrap; word-break:break-word;}
.expl .et{font-weight:700; color:var(--primary); margin-right:6px;}

/* 提交/进度/剩余时间：并入顶栏右侧（原底部条已取消，省出竖向空间） */
/* 提交按钮：低调描边，不抢眼（仍清晰可点） */
#submitBtn{
  border:1px solid var(--border); background:#fff; color:var(--text);
  border-radius:var(--radius); padding:6px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
}
#submitBtn:hover{ background:var(--primary-soft); }
/* 剩余时间 / 已答进度：弱化显示 */
#timer{ font-weight:600; color:var(--muted); font-size:13px; min-width:auto; }
#countdown{ font-size:12px; color:var(--muted); opacity:.85; }
.btn{
  border:none; border-radius:var(--radius); padding:12px 28px; font-size:16px; font-weight:700; cursor:pointer;
  background:var(--primary); color:#fff; font-family:inherit;
}
.btn:hover{background:var(--primary-dark);}
.btn.ghost{background:#eceae4; color:var(--text);}
.countdown{font-size:13px; color:var(--muted); align-self:center;}

#loading,#fatal{padding:40px 16px; text-align:center; color:var(--muted);}
#fatal{color:var(--bad);}
.pdf-tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 2px 10px;}
.tbtn{display:inline-block;border:1px solid var(--border);background:var(--card);color:var(--primary);border-radius:var(--radius);padding:6px 10px;font-size:13px;cursor:pointer;text-decoration:none;font-family:inherit;white-space:nowrap;}
.tbtn:hover{background:var(--primary-soft);}
/* 题号导航条：点击题号跳到试卷对应题目（当前按用户要求隐藏，只保留答题卡内跳转） */
#qnoNav{display:none !important;margin:4px 2px 10px;}
#qnoNav .qn-tip{font-size:13px;color:var(--muted);margin-bottom:6px;}
#qnoChips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding-bottom:4px;}
#qnoChips::-webkit-scrollbar{height:6px;}
#qnoChips::-webkit-scrollbar-thumb{background:#c6c1b7;border-radius:3px;}
.qno-chip{flex:0 0 auto;min-width:30px;height:30px;padding:0 6px;border:1.5px solid var(--border);border-radius:var(--radius);background:#fff;color:var(--text);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s,color .12s;}
.qno-chip:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);}
.qno-chip:active{background:var(--primary);color:#fff;}
/* PDF 渲染区：灰底居中，逐页显示为真实试卷白页（带阴影） */
.pdf-viewer{width:100%; min-height:400px; height:calc(100vh - 250px); background:#4b4e52; border-radius:var(--radius); padding:0; overflow:auto; display:flex; flex-direction:column; align-items:flex-start; gap:12px; box-sizing:border-box; scroll-behavior:smooth;}
@media(min-width:641px){
  .pdf-viewer{height:calc(100vh - 96px); padding:0;}
}
/* 默认：试卷按适中尺寸显示，一屏能看到更多页高（点顶栏「原始大小」可切真实像素、左右拖动看细节） */
.pdf-viewer canvas{background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.35); width:100%; height:auto; max-width:min(720px,94vw); margin:0 auto; display:block;}
.pdf-viewer.native canvas{width:auto; height:auto; max-width:none;}
.pdf-loading{color:#ded9d0; padding:30px; font-size:14px; text-align:center;}
/* 听力音频播放器：仅带音频的试卷出现，悬浮在试卷底部，不额外占一行高度 */
.pdf-col{position:relative;}
#audioBar{position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:15; display:flex; align-items:center; gap:8px; background:rgba(17,24,39,.92); color:#fff; padding:6px 12px; border-radius:999px; box-shadow:0 6px 20px rgba(0,0,0,.4); max-width:94%; box-sizing:border-box;}
#audioBar select{border:none; border-radius:var(--radius); padding:4px 8px; font-size:13px; max-width:200px; background:#fff; color:#1a202c;}
.au-btn{border:none; background:var(--primary); color:#fff; width:34px; height:34px; border-radius:50%; font-size:14px; cursor:pointer; flex:0 0 auto; line-height:1; display:flex; align-items:center; justify-content:center; padding:0;}
.au-btn:hover{filter:brightness(1.1);}
.au-time{font-size:12px; color:#ccc7bd; white-space:nowrap; font-variant-numeric:tabular-nums;}
.au-seek{width:150px; accent-color:#7ea6c4;}
@media(max-width:640px){ #audioBar{left:8px; right:8px; transform:none; max-width:none; bottom:8px; justify-content:center;} .au-seek{width:90px;} }
/* 防止浏览器把家长码/AI密码识别为登录密码而提示保存 */
.code-mask{-webkit-text-security:disc;}
/* 原卷 PDF + 答题区：平板/桌面端左右分栏（答题卡尽量并排），640px 以下才上下堆叠 */
@media(min-width:641px){
  #pdfWrap.pdf-split{display:flex;gap:14px;align-items:flex-start;}
  #pdfWrap.pdf-split .pdf-col{flex:1 1 auto;min-width:0;}
  /* 答题区放在原卷右侧：DOM 顺序（pdf-col 在前、answerPadWrap 在后）即右栏，原卷居中靠左占满其余空间 */
  #pdfWrap.pdf-split #answerPadWrap{flex:0 0 248px;position:sticky;top:74px;max-height:calc(100vh - 92px);overflow:auto;margin-top:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  /* 答题区收起：只留标题栏，PDF 占满全宽 */
  #answerPadWrap.collapsed{flex:0 0 auto !important;background:transparent;border:none;padding:0;box-shadow:none;}
  #answerPadWrap.cardmode{flex:0 0 280px !important;}
}
@media(min-width:900px){
  #pdfWrap.pdf-split #answerPadWrap{flex:0 0 300px;}
  #answerPadWrap.cardmode{flex:0 0 300px !important;}
}
@media(max-width:640px){
  #answerPadWrap{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);padding-top:10px;box-shadow:0 -2px 10px rgba(0,0,0,.06);}
  #answerPadWrap.cardmode{position:static !important;box-shadow:none;max-height:none !important;overflow:visible !important;margin-top:14px;}
}
/* 答题区收起：只留标题栏，PDF 占满全宽 */
#answerPadWrap.collapsed .pad-body{display:none;}
#answerPadWrap.collapsed{padding-bottom:0;}
#answerPadWrap.collapsed .pad-head{margin-bottom:0;}
@media(max-width:600px){
  select{max-width:42vw; font-size:14px;}
  .wrap{padding-bottom:110px;}
  .stem{font-size:15.5px;}
}
/* ===== 正式答题卡（依据原卷生成题号，左侧看卷、右侧作答） ===== */
.card-sec{margin:0 0 10px;}
.card-sec-title{font-size:13px;font-weight:700;color:var(--primary);margin:2px 0 4px;padding-bottom:3px;border-bottom:2px solid var(--primary-soft);}
.card-row{display:flex;gap:6px;align-items:flex-start;padding:4px 0;border-bottom:1px dashed var(--rule);}
.card-no{flex:0 0 28px;height:22px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;margin-top:2px;cursor:pointer;transition:filter .15s,box-shadow .15s;}
.card-no:hover{filter:brightness(1.1);box-shadow:0 0 0 2px var(--primary-soft);}
.card-body{flex:1 1 auto;min-width:0;}
.mc-chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{width:28px;height:28px;border-radius:var(--radius);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted);user-select:none;background:#fff;transition:background .12s,border-color .12s,color .12s;}
.chip:hover{background:var(--bg);}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}
/* 提交后自动批改标记 */
.chip.g-ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important;}
.chip.g-bad{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important;}
.chip.g-answer{border-color:var(--ok)!important;box-shadow:0 0 0 2px var(--ok-soft) inset;color:var(--ok)!important;}
.blank-ref{font-size:12px;color:var(--ok);margin-top:3px;font-weight:600;word-break:break-word;white-space:pre-wrap;}
.blank-input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius);font-size:15px;font-family:inherit;box-sizing:border-box;}
.blank-input:focus{outline:none;border-color:var(--primary);}
.blank-input.g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
.blank-input.g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);}
.essay-row{margin:4px 0;}
.essay-ta{width:100%;min-height:170px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:15px;line-height:1.7;resize:vertical;box-sizing:border-box;}
.essay-ta:focus{outline:none;border-color:var(--primary);}
.card-tip{font-size:12px;color:var(--muted);margin:2px 0 4px;}
/* 答题卡模式：隐藏原自由文本框的头与体，显示结构化答题卡 */
#answerPadWrap.cardmode .pad-head{display:none !important;}
#answerPadWrap.cardmode .pad-body{display:none !important;}
#answerPadWrap.cardmode #cardWrap{display:block;}
#cardWrap{display:none;}
/* 答题卡整体收起：右栏隐藏，试卷占满全宽，右侧悬浮竖条可重新唤出 */
#answerPadWrap.card-collapsed{display:none !important;}
#cardTab{position:fixed; right:0; top:50%; transform:translateY(-50%); writing-mode:vertical-rl; cursor:pointer; font-weight:700; font-size:14px; color:#fff; background:var(--primary); padding:16px 6px; border-radius:10px 0 0 10px; box-shadow:-2px 2px 8px rgba(0,0,0,.18); z-index:60; user-select:none; letter-spacing:2px; display:none;}
#cardTab.show{display:block;}
#cardTab:hover{background:var(--primary-dark);}
/* ===== 知识类 PDF 右侧学习互动面板（背一背 / 测一测 / 用一用）===== */
#knowPanel{font-size:14px;}
#pdfWrap.knowmode #knowPanel{padding:4px 0 40px;}
@media(min-width:641px){
  #pdfWrap.pdf-split #knowPanel{flex:0 0 300px;position:sticky;top:74px;max-height:calc(100vh - 92px);overflow:auto;margin-top:0;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:16px 16px 24px;}
}
@media(max-width:640px){
  #knowPanel{background:#fff;border:1px solid var(--rule);border-radius:3px;padding:16px 16px 24px;margin-top:16px;}
}
.know-head{display:flex;align-items:center;gap:6px;margin:2px 0 10px;flex-wrap:wrap;}
.know-title{font-family:var(--font-ui);font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.04em;flex:1 1 auto;min-width:80px;}
.know-tabs{display:flex;gap:4px;}
.know-tab{border:1px solid var(--rule);background:#fff;color:var(--ink-soft);border-radius:3px;padding:5px 11px;font-size:13px;cursor:pointer;font-family:var(--font-ui);letter-spacing:.03em;}
/* 选中态用「淡底 + 主色字」而不是实心大色块：少一块饱和色，观感立刻安静下来 */
.know-tab.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-line);font-weight:600;}
.know-sub{display:flex;gap:4px;margin-bottom:12px;}
.know-body{min-height:200px;}
.know-prog{font-family:var(--font-ui);font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:12px;}
/* 面板抬头：教材版本 + 资料名 + 条目数。低调一行，作用是「说清这是什么」 */
.know-masthead{font-family:var(--font-ui);font-size:11.5px;color:var(--muted);letter-spacing:.06em;line-height:1.6;margin:0 0 16px;}
.know-masthead .know-mh-sep{margin:0 6px;color:var(--border);}
.know-card{background:#fff;border:1px solid var(--rule);border-radius:3px;padding:26px 20px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;}
.know-front{font-family:var(--font-read);font-size:22px;font-weight:600;color:var(--ink);white-space:pre-wrap;word-break:break-word;line-height:1.5;}
.know-back{font-family:var(--font-read);font-size:16.5px;color:var(--primary);white-space:pre-wrap;text-align:left;word-break:break-word;line-height:1.8;}
.know-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.know-btns button{border:1px solid var(--rule);background:#fff;color:var(--ink-soft);border-radius:3px;padding:6px 16px;font-size:13.5px;cursor:pointer;font-family:var(--font-ui);letter-spacing:.04em;transition:background .12s,color .12s;}
.know-btns button:hover{background:var(--primary-soft);color:var(--ink);}
.know-btns button.primary{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600;letter-spacing:.08em;padding:7px 20px;}
.know-btns button.primary:hover{background:var(--primary-dark);color:#fff;}
.know-hint{font-family:var(--font-ui);font-size:12px;color:var(--muted);margin-top:10px;text-align:center;}
.know-prompt{font-family:var(--font-read);font-size:19px;font-weight:600;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:0 0 12px;text-align:left;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;line-height:1.6;}
.know-inputs{display:flex;flex-direction:column;gap:12px;max-width:38rem;}
.know-inputs label{font-family:var(--font-ui);font-size:12px;color:var(--muted);letter-spacing:.06em;}
.know-inp{width:100%;padding:7px 2px;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:transparent;font-size:16px;font-family:var(--font-en);color:var(--ink);}
.know-inp:focus{outline:none;border-bottom-color:var(--primary);}
.know-inp.g-ok{background:var(--ok-soft);border-bottom-color:var(--ok);color:var(--ok);}
.know-inp.g-bad{background:var(--bad-soft);border-bottom-color:var(--bad);color:var(--bad);}
.know-result{font-family:var(--font-ui);font-size:13.5px;margin-top:14px;white-space:pre-wrap;word-break:break-word;line-height:1.8;}
.know-result.ok{color:var(--ok);}
.know-result.bad{color:var(--bad);}
.know-ext-word{font-family:var(--font-ui);font-size:13.5px;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:14px;word-break:break-word;max-width:100%;line-height:1.75;}
/* 用一用 · 词条模式的词条头：原来只是一行 13.5px 灰字，读起来像提示语；
   放大成衬线条目名 + 发丝线，一眼看到在练哪个词 */
.know-term{font-family:var(--font-read);font-size:19px;font-weight:600;color:var(--ink);letter-spacing:.01em;margin:0;word-break:break-word;max-width:100%;line-height:1.45;}
.know-ext-out{margin-top:0;border-top:1px solid var(--rule);padding:15px 0 0;font-family:var(--font-read);font-size:15.5px;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:break-word;background:none;border-radius:0;min-height:0;max-width:100%;}
.know-ext-out.know-ext-ok{background:none;}
.know-ext-out.know-ext-fallback{background:none;border-top-color:var(--na);color:var(--accent);padding-left:12px;border-left:3px solid var(--na);}
/* 用一用 · 要点选择（一个核心知识里可以按「核心词汇 / 核心短语 / 重点句型 / 核心语法」分别练） */
.know-scope{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px;max-width:100%;}
.know-scope .know-tab{max-width:22em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 用一用 · 本地例句库：例句按「悬挂式编号 + 右侧正文」排，和纸质练习册的题号排法一致 */
.kb-forms{font-family:var(--font-ui);font-size:13px;color:var(--ink-soft);display:block;line-height:1.8;margin:0 0 10px;}
.kb-tip{font-family:var(--font-ui);font-size:13px;color:var(--accent);background:none;border-left:2px solid var(--na);border-radius:0;padding:2px 0 2px 10px;margin:0 0 16px;line-height:1.8;}
.kb-ex{display:grid;grid-template-columns:22px 1fr;column-gap:9px;border-top:1px solid var(--rule);padding:14px 0;margin:0;}
.kb-ex:first-of-type{border-top:0;padding-top:2px;}
.kb-ex .kb-n{grid-column:1;font-family:var(--font-en);font-weight:600;color:var(--muted);font-size:13.5px;line-height:1.65;text-align:right;}
.kb-ex .kb-ex-body{grid-column:2;min-width:0;}
.kb-ex .kb-en{font-family:var(--font-en);font-size:16.5px;font-weight:400;color:var(--ink);line-height:1.62;}
.kb-ex .kb-zh{font-family:var(--font-read);font-size:14.5px;color:var(--ink-soft);margin-top:5px;line-height:1.7;}
.kb-ex .kb-note{font-family:var(--font-ui);font-size:12.5px;color:var(--accent);margin-top:7px;line-height:1.7;}
.kb-foot{font-family:var(--font-ui);font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-top:18px;padding-top:10px;border-top:1px solid var(--rule);}
@media(max-width:640px){
 .know-term{font-size:18px;}
 .kb-ex .kb-en{font-size:16px;}
 .kb-ex .kb-zh{font-size:14px;}
}
/* 知识互动：顶部常驻工具栏（背一背/测一测/用一用/看原卷）
   改成印刷目录式的下划线页签 —— 四个描边盒子按钮最像后台系统，也是「AI 味」的来源之一 */
#knowBar{display:none;gap:0;flex-wrap:wrap;align-items:flex-end;margin:0 0 18px;padding:0;background:none;border:0;border-bottom:1px solid var(--rule);border-radius:0;}
#knowBar .know-bar-label{font-family:var(--font-ui);font-size:11.5px;color:var(--muted);letter-spacing:.14em;margin:0 14px 10px 0;}
#knowBar .know-bar-btn{border:0;border-bottom:2px solid transparent;background:none;color:var(--ink-soft);border-radius:0;padding:6px 14px 8px;margin-bottom:-1px;font-size:14px;cursor:pointer;font-family:var(--font-ui);font-weight:500;letter-spacing:.06em;transition:color .12s,border-color .12s;}
#knowBar .know-bar-btn:hover{color:var(--ink);}
#knowBar .know-bar-btn.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;background:none;}
#pdfWrap.knowmode{display:block !important;}
/* 互动视图：把页签与正文收成一条居中的单栏（≈教材单栏宽度）。
   原来各块分别按 em 限宽，而 em 基准随各自 font-size 变化（644 / 621 / 713px 参差），
   又统统靠左，右半边留一大片空；改成在容器上统一定宽 + 居中，右侧留白变成对称版心 */
#pdfWrap.knowmode > #knowBar,
#pdfWrap.knowmode > #knowPanel{max-width:min(50rem,100%);margin-left:auto;margin-right:auto;}
#pdfWrap.knowmode #knowPanel{display:block;position:static;max-height:none;overflow:visible;flex:none;}
/* 抽背自查：靠左侧色条区分记住/没记住，不用大色块背景 */
.know-rec-card{border:1px solid var(--rule);border-left:3px solid var(--rule);border-radius:3px;padding:14px 16px;margin-bottom:10px;background:#fff;}
.know-rec-card.rec-ok{border-left-color:var(--ok);}
.know-rec-card.rec-no{border-left-color:var(--bad);}
.know-rec-title{font-family:var(--font-ui);font-weight:600;color:var(--ink);font-size:13.5px;letter-spacing:.03em;margin-bottom:8px;}
.know-rec-prompt{font-family:var(--font-read);color:var(--ink-soft);font-size:15px;line-height:1.7;}
.know-rec-ans{white-space:pre-wrap;word-break:break-word;line-height:1.85;font-size:15px;margin-top:8px;}
.know-rec-btns{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
.know-rec-btns button{border:1px solid var(--rule);background:#fff;color:var(--ink-soft);border-radius:3px;padding:5px 14px;font-size:13px;cursor:pointer;font-family:var(--font-ui);letter-spacing:.04em;}
.know-rec-btns button:hover{background:var(--primary-soft);}
.know-rec-btns button.know-rec-ok{background:var(--ok);color:#fff;border-color:var(--ok);}
.know-rec-btns button.know-rec-no{background:var(--bad);color:#fff;border-color:var(--bad);}
.know-rec-done{font-size:13px;font-weight:600;}
/* ===== text 型阅读：印刷品式排版（无卡片、无胶囊，靠字号/字族/对齐分层） ===== */
.know-read-card{background:#fff;border:0;border-top:1px solid var(--rule);border-radius:0;padding:26px 0 10px;margin:0;max-width:100%;}
.know-read-card:first-of-type{border-top:0;padding-top:8px;}
.know-t-h{font-family:var(--font-ui);font-weight:600;color:var(--ink);margin:0 0 14px;font-size:16px;letter-spacing:.04em;padding:0 0 0 0;}
.know-t-h::after{content:"";display:block;width:28px;height:2px;background:var(--primary);margin-top:8px;opacity:.85;}
.know-read-t{font-family:var(--font-read);line-height:1.85;font-size:16.5px;color:var(--ink);}
.know-read-line{margin:.62em 0;padding-left:0;}
.know-read-line:first-child{margin-top:0;}
.know-read-line:last-child{margin-bottom:0;}
/* 带序号的行：悬挂缩进，换行后与首行文字对齐 */
.know-read-line.has-num{padding-left:1.9em;text-indent:-1.9em;}
.know-read-line.has-num>*{text-indent:0;}
/* 成对短语/词汇：两列对齐的词汇表（英文左、中文右），不用胶囊 */
.know-read-line.phrase-line{margin:.85em 0;}
.know-read-line.phrase-line>.know-num{display:block;text-indent:0;margin-bottom:4px;}
.ph-grid{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);column-gap:18px;row-gap:7px;align-items:baseline;font-family:var(--font-ui);}
.ph-en{font-family:var(--font-en);font-size:16px;color:var(--ink);word-break:break-word;}
.ph-zh{font-size:14.5px;color:var(--ink-soft);line-height:1.55;word-break:break-word;}
.know-read-item{display:contents;}
.know-read-tools{position:sticky;top:0;z-index:2;display:flex;gap:8px;margin:0 0 18px;padding:10px 0;background:rgba(255,255,255,.96);border-bottom:1px solid var(--rule);}
/* 词汇表：单词 / 音标 / 词性 / 释义 四列对齐 */
.know-vocab-row{display:grid;grid-template-columns:minmax(0,17%) minmax(0,19%) minmax(0,8%) minmax(0,1fr);column-gap:16px;row-gap:8px;margin:1em 0;align-items:baseline;font-family:var(--font-ui);max-width:100%;}
.know-vocab{display:contents;}
.know-vocab .v-word{font-family:var(--font-en);font-weight:600;font-size:16px;color:var(--ink);}
.know-vocab .v-phon{font-family:var(--font-en);color:var(--ink-soft);font-style:italic;font-size:13.5px;white-space:nowrap;}
.know-vocab .v-pos{color:var(--muted);font-size:12px;font-weight:500;letter-spacing:.03em;white-space:nowrap;}
.know-vocab .v-mean{color:var(--ink-soft);font-size:14.5px;line-height:1.55;}
.know-num{font-family:var(--font-ui);font-weight:600;color:var(--primary);font-size:.95em;font-variant-numeric:tabular-nums;}
/* 中英句对：英文一行、中文译文一行 */
.know-read-line.pair-en{margin:.95em 0 0;font-family:var(--font-en);font-size:16.5px;line-height:1.62;letter-spacing:0;}
.know-read-line.pair-zh{margin:.22em 0 .95em;font-family:var(--font-read);font-size:14.5px;line-height:1.7;color:var(--ink-soft);}
@media(max-width:640px){
  .know-read-card{padding:20px 0 6px;}
  .know-read-t{font-size:16px;line-height:1.8;}
  .know-read-line.pair-en{font-size:16px;}
  .know-read-line.pair-zh{font-size:14px;}
  .ph-grid{grid-template-columns:minmax(0,1fr);row-gap:2px;column-gap:0;}
  .ph-en{margin-top:7px;}
  .know-vocab-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:3px;}
  .know-vocab .v-mean{grid-column:1/-1;}
}

<script>
const $ = s => document.querySelector(s);
// 学习记录：只存本机浏览器，不上传。报告页 report.html 读取同一份数据。
function LT(){ return window.LearnTrack || null; }
function trackStart(cat, item){ try{ const t=LT(); if(t) t.start(cat, item); }catch(e){} }
function trackQuiz(o){ try{ const t=LT(); if(t) t.trackQuiz(o); }catch(e){} }
let curCatName = '', curPaperLabel = '';   // 当前分类/试卷名，供学习记录归类
// 家长码：孩子提交试卷后，正确答案与解析默认锁定，需输入此码才能查看。改成你自己的数字即可。
const PARENT_CODE = '8888';
let manifest = null, paper = null, curCi = 0, curPi = 0, submitted = false, answersLocked = true, paperIsPdf = false, paperHasCard = false, paperHasKnowledge = false, curStudentPdf = '', curAnswerPdf = '';
let curCard = null, curCardKey = '';   // 当前答题卡结构与 localStorage key
let curAnswers = null, curSaved = {}, lastMin = 30;   // 当前答案（用于自动批改）/ 已存作答 / 上次考试时长
let curPositions = {};   // 题号在学生版试卷上的位置 {题号:[页码,纵向比例]}，用于点击题号跳转（考试/浏览时用，最准）
let curAnswerPositions = {};   // 题号在解析版试卷上的位置（仅含答题卡的卷从 answers.json 取），解锁解析版后用
let viewingAnswer = false;     // 当前 #pdfViewer 显示的是否为解析版（决定跳转用哪套位置）
let ALL_POS = null;            // 全部试卷的题号位置表（positions.json）
let curPdfDoc = null;          // 当前已加载的 PDF 文档（供点击题号时实时检索题号位置）
let runtimePos = {};           // 运行时检索到的题号位置缓存（按当前试卷）
let navNumbers = null;         // 运行时从 PDF 文本扫描出的题号全集（用于导航条，比离线更全）
let examStarted = false, examEndTime = 0, timerInterval = null;
let curPadKey = '';   // 当前试卷的答题区 localStorage key
let padAuto = true;   // 答题区自动编号开关（默认开）
let curSections = ['一、'];   // 大题列表（中文数字 + 、）
let curSectionIdx = 0;       // 当前选中的大题序号
let sectionTexts = {};       // 各小题答题内容 {idx: text}
let renderedStudentKey = ''; // 已渲染的原卷 PDF 标记，避免同一份重复渲染
const LETTERS = "ABCDEFGH";

// ===== PDF.js：把原卷/解析版渲染成居中真实试卷页 =====
const PDFJS_VER = '3.11.174';
function initPdfJs(){
  if(!window.pdfjsLib) return false;
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VER + '/pdf.worker.min.js';
  return true;
}
async function renderPdf(el, url){
  el.innerHTML = '<div class="pdf-loading">正在加载试卷…</div>';
  runtimePos = {}; navNumbers = null;   // 切卷/解锁解析版：清空运行时缓存
  if(!initPdfJs()){ el.innerHTML = '<div class="pdf-loading">PDF 组件未加载（可能离线），请用上方「新窗口打开」按钮查看原卷。</div>'; return; }
  let pdf;
  try{ pdf = await window.pdfjsLib.getDocument({url}).promise; }
  catch(e){ el.innerHTML = '<div class="pdf-loading">试卷加载失败：' + (e.message||e) + '</div>'; return; }
  curPdfDoc = pdf;   // 保存文档引用，供点击题号时实时检索位置
  // 渲染进度条挂在末尾：画布始终插在它前面，保证 canvas 顺序与页码一致（题号跳转依赖这个顺序）
  el.innerHTML = '<div class="pdf-loading" id="pdfProg">正在渲染 0/' + pdf.numPages + ' 页…</div>';
  const prog = ()=> el.querySelector('#pdfProg');
  for(let i=1;i<=pdf.numPages;i++){
    try{
      const page = await pdf.getPage(i);
      const vp = page.getViewport({scale:1.6});
      const canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      const ctx = canvas.getContext('2d');
      await page.render({canvasContext:ctx, viewport:vp}).promise;
      const ph = prog();
      if(ph) el.insertBefore(canvas, ph); else el.appendChild(canvas);
      if(ph) ph.textContent = '正在渲染 ' + i + '/' + pdf.numPages + ' 页…';
      if(i % 3 === 0) await new Promise(r=> setTimeout(r, 0));   // 每 3 页让出主线程，长卷也不卡页面
    }catch(e){ const d=document.createElement('div'); d.className='pdf-loading'; d.textContent='第'+i+'页渲染失败'; el.appendChild(d); }
  }
  const ph = prog(); if(ph) ph.remove();
  // rebuildNavAsync(); // 当前隐藏顶部题号导航条，不再实时扫描刷新
}

function showFatal(msg){ $('#loading').style.display='none'; const f=$('#fatal'); f.style.display='block'; f.textContent=msg; }

async function init(){
  try{
    const r = await fetch('exam-data/manifest.json', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    manifest = await r.json();
  }catch(e){
    showFatal('无法加载试卷清单（exam-data/manifest.json）。请通过网站访问本页面，不要直接用浏览器打开本地文件。');
    return;
  }
  $('#loading').style.display='none';
  const catSel = $('#catSel'), paperSel = $('#paperSel');
  manifest.cats.forEach((c, ci)=>{
    const o = document.createElement('option'); o.value = ci; o.textContent = c.label; catSel.appendChild(o);
  });
  catSel.addEventListener('change', ()=>{ curCi = +catSel.value; populatePapers(); loadPaper(0); });
  paperSel.addEventListener('change', ()=>{ curPi = +paperSel.value; loadPaper(curPi); });
  populatePapers();
  loadPaper(0);
  loadPositionsAsync();   // 题号位置表体积不小，放到首屏之后再后台载入，不拖慢打开速度
}
// 题号位置表（点击题号跳转用）：首屏之后再加载，避免和试卷抢带宽
function loadPositionsAsync(){
  const go=()=> fetch('exam-data/positions.json', {cache:'no-store'})
    .then(r=> r.ok ? r.json() : null)
    .then(j=>{
      if(!j) return;
      ALL_POS = j;
      // 位置表迟到时补一次：如果当前卷还没拿到离线位置，就补上（否则这一卷只能靠实时检索）
      const cat = manifest && manifest.cats[curCi];
      const p = cat && cat.papers[curPi];
      if(p && !Object.keys(curPositions).length){
        const posKey = (p.cat || cat.name || '') + '||' + p.label;
        curPositions = (ALL_POS && ALL_POS[posKey]) || {};
      }
    })
    .catch(()=>{});
  if(window.requestIdleCallback) requestIdleCallback(go, {timeout: 3000});
  else setTimeout(go, 1200);
}

function populatePapers(){
  const paperSel = $('#paperSel'); paperSel.innerHTML='';
  manifest.cats[curCi].papers.forEach((p, pi)=>{
    const o = document.createElement('option'); o.value = pi;
    o.textContent = p.label + (p.count != null ? '（' + p.count + '）' : '');
    paperSel.appendChild(o);
  });
}

async function loadPaper(pi){
  curPi = pi; submitted = false; examStarted = false;
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  $('#pdfWrap').style.display='none';
  $('#ansWrap').style.display='none';
  const p = manifest.cats[curCi].papers[pi];
  flushRec();   // 换卷前先把上一份的抽背自查累计记下
  curCatName = manifest.cats[curCi].label || manifest.cats[curCi].name || '';
  curPaperLabel = p.label || '';
  trackStart(curCatName, curPaperLabel);   // 学习记录：从这一刻开始给这份材料计时
  $('#paperTitle').style.display='inline';
  $('#paperTitle').textContent = p.label;
  $('#list').innerHTML = '';
  $('#summary').style.display='none';
  $('#filterbar').style.display='none';
  $('#unlockPanel').style.display='none';
  $('#codeInput').value='';
  $('#codeMsg').textContent='';
  answersLocked = true;
  $('#examStatus').style.display='none';
  $('#timer').textContent='';
  // PDF 原卷模式：直接呈现试卷 PDF，不解析题目
  paperIsPdf = !!p.pdf;
  paperHasCard = !!p.card;
  paperHasKnowledge = !!p.knowledgeData;
  // 题号位置：先用学生版位置（考试/浏览阶段最准）；解析版位置在 buildCard 里单独载入
  const posKey = (p.cat || (manifest.cats[curCi].name || '')) + '||' + p.label;
  curPositions = (ALL_POS && ALL_POS[posKey]) ? ALL_POS[posKey] : {};
  curAnswerPositions = {};
  viewingAnswer = false;
  curPdfDoc = null; runtimePos = {}; navNumbers = null;
  $('#qnoNav').style.display = 'none';   // 非 PDF 或切换时先隐藏，render() 里按需显示
  // 切换试卷时清掉上一套的答题卡状态
  $('#answerPadWrap').classList.remove('cardmode');
  $('#cardBody') && ($('#cardBody').innerHTML = '');
  curCard = null; curCardKey = '';
  if(paperIsPdf){
    $('#pdfWrap').style.display='none';
    $('#ansWrap').style.display='none';
    $('#pdfViewer').innerHTML='';
    $('#ansViewer').innerHTML='';
    renderedStudentKey = '';
    $('#answerPadWrap').style.display='none';
    $('#answerPad').value='';
    curPadKey = '';
    // 纯浏览原卷（知识梳理/知识点总结等无答题卡结构）：打开即显示 PDF，不进入计时/交卷考试流
    // 有答题卡结构（一课一练/专项等）无论是否 readOnly 都进入考试流，可作答、提交、批改
    if(p.readOnly && !paperHasCard){
      $('#startPanel').style.display='none';
      render();
      return;
    }
    showStartPanel(p.label);
    return;
  }
  try{
    const r = await fetch('exam-data/' + p.file + '?v=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    paper = await r.json();
  }catch(e){
    showFatal('无法加载试卷：' + p.label + '（' + e.message + '）');
    return;
  }
  showStartPanel(p.label);
}

// 显示「开始答题」面板（选卷后先不进题）
function showStartPanel(label){
  $('#startPanel').style.display='block';
  $('#startTitle').textContent = label;
  $('#startBtn').style.display='inline-block';
  $('#timeInputArea').style.display='none';
  $('#timeMsg').textContent='';

}

// 开始考试：设置时长后进入倒计时
function beginExam(min){
  lastMin = min;
  examStarted = true;
  $('#startPanel').style.display='none';
  $('#examStatus').style.display='flex';
  try { render(); } catch(e){ console.error('render 失败', e); }
  updateCountdown();
  examEndTime = Date.now() + min*60000;
  updateTimer();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer(){
  if(!examStarted) return;
  const remain = examEndTime - Date.now();
  if(remain <= 0){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    $('#timer').textContent = '时间到';
    submit(true); // 自动交卷
    return;
  }
  const s = Math.floor(remain/1000);
  const mm = String(Math.floor(s/60)).padStart(2,'0');
  const ss = String(s%60).padStart(2,'0');
  $('#timer').textContent = '剩余 ' + mm + ':' + ss;
}

function render(){
  // PDF 原卷模式：呈现试卷 PDF（完整原文），不渲染单选题卡片
  if(paperIsPdf){
    $('#list').style.display='none';
    $('#pdfWrap').style.display='block';
    viewingAnswer = false;   // 进入试卷即学生版视图
    const p = manifest.cats[curCi].papers[curPi];
    curStudentPdf = p.pdf || '';
    curAnswerPdf = p.answerPdf || '';
    setupPdfTools();
    setupAudio(p);   // 带听力音频的试卷 → 显示底部音频播放条
    // 渲染原卷 PDF（真实试卷一页页居中显示）；同一份不重复渲染
    if(curStudentPdf && curStudentPdf !== renderedStudentKey){
      renderPdf($('#pdfViewer'), encodeURI(curStudentPdf));
      renderedStudentKey = curStudentPdf;
    }
    // 有答题卡结构 → 渲染「正式答题卡」；否则用原有的自由文本框
    if(paperHasCard){
      $('#answerPadWrap').classList.add('cardmode');
      buildCard(p);
    } else {
      $('#answerPadWrap').classList.remove('cardmode');
      loadPadForPaper(p);
    }
    $('#pdfWrap').classList.add('pdf-split');
    $('#pdfWrap').classList.remove('knowmode','kp-active');
    const _kb=$('#knowBar'); if(_kb) _kb.style.display='none';
    // 每次切卷重置答题卡收起/悬浮竖条状态，避免上一份卷的收起态残留
    $('#answerPadWrap').classList.remove('card-collapsed');
    $('#cardTab').classList.remove('show');
    const _rb = $('#cardReopenBtn'); if(_rb) _rb.style.display = '';
    const pdfCol = document.querySelector('#pdfWrap .pdf-col');
    if(pdfCol) pdfCol.style.display = '';
    if(cardPdfToggle) cardPdfToggle.textContent = '隐藏试卷';
    if(pdfZoomBtn){ pdfZoomBtn.textContent = '原始大小'; $('#pdfViewer').classList.remove('native'); }
    // 纯浏览卷且无答题卡结构（知识梳理/知识点总结等）→ 收起并彻底隐藏入口，避免看到自由记事本
    if(p.readOnly && !paperHasCard){ collapseCard(); $('#cardTab').classList.remove('show'); const rb=$('#cardReopenBtn'); if(rb) rb.style.display='none'; }
    // 不设置 inline display，让 CSS 媒体查询决定 flex（桌面/平板左右分栏）还是 block（超窄屏堆叠）
    $('#pdfWrap').style.display='';
    if(paperHasKnowledge){
      $('#answerPadWrap').style.display='none';
      $('#knowPanel').style.display='none';
      $('#pdfWrap').classList.add('knowmode');
      setupKnowBar(p);
      loadKnowledge(p.knowledgeData);   // 后台载入数据；默认先看原卷，点工具栏切换互动
      showKnowPdf();
    } else if(p.cat==='知识梳理' || p.cat==='知识点总结'){
      $('#answerPadWrap').style.display='none';

    }
    buildQnoNav();   // 渲染题号导航条（试卷 PDF 全部题号可点击跳转）
    return;
  }
  // 非 PDF（JSON 选择题）模式：隐藏答题区与原卷，收起顶部原卷工具
  $('#pdfWrap').classList.remove('pdf-split');
  $('#answerPadWrap').style.display='none';
  $('#pdfOpenBtn').style.display='none';
  $('#pdfDlBtn').style.display='none';
  const _zb=$('#pdfZoomBtn'); if(_zb) _zb.style.display='none';
  setupAudio(null);
  const list = $('#list'); list.innerHTML='';
  paper.questions.forEach((q, idx)=>{
    const card = document.createElement('div');
    card.className = 'qcard'; card.dataset.idx = idx;
    const optsHtml = (q.opts||[]).map((t, i)=>{
      const L = LETTERS[i] || ('?'+i);
      return `<label class="opt" data-letter="${L}">
        <input type="radio" name="q${idx}" value="${L}">
        <span class="ltr">${L}</span>
        <span class="otext"></span></label>`;
    }).join('');
    card.innerHTML = `
      <div class="qhead"><span class="qno">${idx+1}</span></div>
      <div class="stem"></div>
      <div class="opts">${optsHtml}</div>
      <div class="result"></div>
      <div class="expl"><span class="et">解析</span><span class="expl-body"></span></div>`;
    // 用 textContent 防注入
    card.querySelector('.stem').textContent = q.stem || '';
    (q.opts||[]).forEach((t,i)=>{
      const ot = card.querySelectorAll('.opt .otext')[i];
      if(ot) ot.textContent = t;
    });
    card.querySelector('.expl-body').textContent = q.expl || '';
    // 绑定点击
    card.querySelectorAll('.opt').forEach(opt=>{
      opt.addEventListener('click', e=>{
        if(submitted) return;
        const inp = opt.querySelector('input');
        inp.checked = true;
        card.querySelectorAll('.opt').forEach(o=>o.classList.remove('chosen'));
        opt.classList.add('chosen');
      });
    });
    list.appendChild(card);
  });
  $('#examStatus').style.display='flex';
  updateCountdown();
}

function updateCountdown(){
  const cd = $('#countdown');
  if(paperIsPdf){
    // PDF 原卷模式：依据答题卡结构 + 已存作答，精确统计每题作答情况
    if(!curCard){ cd.textContent = ''; return; }
    let total = 0, done = 0;
    curCard.sections.forEach((sec, si)=>{
      if(sec.type === 'essay'){
        total += 1;
        if((curSaved['essay_'+si]||'').trim()) done++;
      } else {
        (sec.nos||[]).forEach(no=>{
          total += 1;
          const k = (sec.type === 'mc' ? 'm_' : 'b_') + si + '_' + no;
          if((curSaved[k]||'').trim()) done++;
        });
      }
    });
    cd.textContent = submitted ? '' : ('已作答 ' + done + ' / ' + total);
    return;
  }
  if(!paper) return;
  const total = paper.questions.length;
  let done = 0;
  document.querySelectorAll('.qcard').forEach(c=>{
    if(c.querySelector('input[type=radio]:checked')) done++;
  });
  cd.textContent = submitted ? '' : ('已作答 ' + done + ' / ' + total);
}

function normalizeBlank(s){
  return String(s || '').toLowerCase()
    .replace(/[.,!?;:'"()\[\]{}]/g, ' ')
    .replace(/[\n\r\t]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function blankMatches(input, answer){
  const inp = normalizeBlank(input);
  if(!inp) return false;
  const alts = String(answer || '').split('/').map(a => normalizeBlank(a)).filter(Boolean);
  return alts.some(alt => alt === inp);
}
// 提交后：依据 answers.json 自动批改答题卡（选择题 ✓/✗，填空标色并显示参考答案，作文不统计）
function gradeCard(){
  const body = $('#cardBody');
  if(!body) return {correct:0, wrong:0, unans:0, total:0, blankN:0, blankCorrect:0, essayN:0};
  let correct=0, wrong=0, unans=0, total=0;
  let blankN=0, blankCorrect=0, blankWrong=0, blankUnans=0, blankGraded=0;
  let essayN = 0;
  if(curCard && curCard.sections){
    curCard.sections.forEach(sec => { if(sec.type === 'essay') essayN++; });
  }
  body.querySelectorAll('.mc-chips').forEach(chips=>{
    const no = chips.dataset.no;
    const si = chips.dataset.si;
    const k = 'm_' + si + '_' + no;
    const chosen = (curSaved[k] || '').toUpperCase();
    // 优先按「板块下标_题号」(si_no) 查答案，兼容单元检测旧版全局 no
    const ans = curAnswers ? (curAnswers[si + '_' + no] || curAnswers[String(no)] || curAnswers[no] || '') : '';
    const ansL = String(ans).trim().toUpperCase();
    const isLetter = /^[A-F]$/.test(ansL);
    chips.querySelectorAll('.chip').forEach(c=>{
      c.classList.remove('g-ok','g-bad','g-answer');
      c.style.pointerEvents = 'none';   // 批改后锁定，防止误改
    });
    if(isLetter){
      total++;   // 仅统计可批改（答案为单字母）的选择题
      const right = chips.querySelector('.chip[data-l="'+ansL+'"]');
      if(right) right.classList.add('g-answer');   // 无论对错，标出正确选项
      const pick = chips.querySelector('.chip[data-l="'+chosen+'"]');
      if(chosen && chosen === ansL){ correct++; if(pick) pick.classList.add('g-ok'); }
      else if(chosen){ if(pick) pick.classList.add('g-bad'); wrong++; }
      else { unans++; }
    }
    // 非单字母答案（提取缺失或本就为单词作答）：不计入错对，由解析版对照
  });
  body.querySelectorAll('.blank-input').forEach(inp=>{
    blankN++;
    const no = inp.dataset.no;
    const si = inp.dataset.si;
    // 优先按「板块下标_题号」(si_no) 查答案，兼容单元检测旧版全局 no
    const ans = curAnswers ? (curAnswers[si + '_' + no] || curAnswers[String(no)] || curAnswers[no] || '') : '';
    inp.readOnly = true;
    let ref = inp.parentElement.querySelector('.blank-ref');
    if(!ref){ ref = document.createElement('div'); ref.className = 'blank-ref'; inp.parentElement.appendChild(ref); }
    ref.textContent = '参考答案：' + (ans || '（暂无）');
    const val = (inp.value || '').trim();
    inp.classList.remove('g-ok','g-bad');
    if(String(ans).trim()){
      blankGraded++;
      if(!val){ blankUnans++; }
      else if(blankMatches(val, ans)){ blankCorrect++; inp.classList.add('g-ok'); }
      else { blankWrong++; inp.classList.add('g-bad'); }
    }
  });
  correct += blankCorrect; wrong += blankWrong; unans += blankUnans; total += blankGraded;
  return {correct, wrong, unans, total, blankN, blankCorrect, blankWrong, blankUnans, essayN};
}

function submit(auto){
  if((!paper && !paperIsPdf) || submitted) return;
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  examStarted = false;
  // PDF 原卷模式：无单选题评分，交卷后由家长码解锁解析版
  if(paperIsPdf){
    submitted = true;
    answersLocked = true;             // 交卷后答案与解析默认锁定，需家长码解锁
    $('#submitBtn').textContent = '重新作答';
    $('#submitBtn').onclick = redo;
    $('#timer').textContent = auto ? '时间到，已自动交卷' : '';
    $('#countdown').textContent = '';
    // 自动批改答题卡（如有），在右侧答题卡上直接标出 ✓/✗ 与正确项、填空附参考答案
    let stats = {correct:0, wrong:0, unans:0, total:0, blankN:0};
    if(paperHasCard){ stats = gradeCard(); reopenCard(); }
    // 学习记录：交卷成绩（只统计可批改的选择+填空）
    if(stats.total > 0) trackQuiz({src:'card', mod:curPaperLabel || '答题卡', right:stats.correct, wrong:stats.wrong, unans:stats.unans, total:stats.total});
    // 交卷后保留学生卷与已批改的答题卡；解析版保持锁定，由家长码解锁后才显示
    $('#unlockPanel').style.display = 'block';
    $('#codeInput').value=''; $('#codeMsg').textContent='';
    // 结果汇总
    const s = $('#summary');
    s.style.display='block';
    if(paperHasCard && stats.total > 0){
      const pct = stats.total ? Math.round(stats.correct/stats.total*100) : 0;
      const blankTxt = stats.blankN ? `填空 对 ${stats.blankCorrect}/${stats.blankN}` : '';
      const essayTxt = stats.essayN ? `作文 ${stats.essayN} 篇（不统计）` : '';
      const extraTxt = [blankTxt, essayTxt].filter(Boolean).join('，');
      s.innerHTML = `<div class="summary-row">
        <div class="stat"><span>得分（选择+填空）</span><b>${stats.correct} / ${stats.total}</b></div>
        <div class="stat"><span>正确率</span><b>${pct}%</b></div>
        <div class="stat"><span>答错</span><b style="color:var(--bad)">${stats.wrong}</b></div>
        <div class="stat"><span>未作答</span><b style="color:var(--na)">${stats.unans}</b></div>
        <div class="stat"><span>填空/作文</span><b>${extraTxt || '—'}</b></div>
      </div>

function cnNum(n){
  const d=['零','一','二','三','四','五','六','七','八','九','十'];
  if(n<=10) return d[n];
  if(n<20) return '十'+(n%10?d[n%10]:'');
  if(n<100){ const t=Math.floor(n/10), o=n%10; return d[t]+'十'+(o?d[o]:''); }
  return String(n);
}

function noBadge(no){

// 找到真正可滚动的容器（iframe 文档或嵌套的 overflow 元素），保证跳转一定能滚到
function findScroller(el){
  let n = el;
  while(n && n !== document.documentElement && n !== document.body){
    const s = getComputedStyle(n);
    const ov = s.overflowY || s.overflow;
    if((ov === 'auto' || ov === 'scroll') && n.scrollHeight > n.clientHeight + 2) return n;
    n = n.parentElement;
  }
  return window;
}
function scrollToY(scroller, y){
  if(scroller === window) window.scrollTo({top:y, behavior:'smooth'});
  else scroller.scrollTo({top:y, behavior:'smooth'});
}
// 在已加载的 PDF 文本里检索题号 no 的精确位置（行首数字），返回 {pageIdx, yFrac}
async function searchPdfForQuestion(no){
  if(!curPdfDoc) return null;
  const sNo = String(no);
  for(let i=1;i<=curPdfDoc.numPages;i++){
    let page, tc;
    try{ page = await curPdfDoc.getPage(i); tc = await page.getTextContent(); }
    catch(e){ continue; }
    const v = page.getViewport({scale:1});
    const pageH = v.height || 1;
    // 把文本项按 y（PDF 坐标，自下而上）聚类成行，取每行最左侧文本判断是否为行首题号
    const lines = {};
    for(const it of tc.items){
      if(!it.str || !it.str.trim()) continue;
      const y = it.transform ? it.transform[5] : 0;
      const key = Math.round(y/3)*3;
      (lines[key] = lines[key] || []).push(it);
    }
    const ys = Object.keys(lines).map(Number).sort((a,b)=>b-a);   // 自上而下
    for(const y of ys){
      const row = lines[y].sort((a,b)=>(a.transform?a.transform[4]:0)-(b.transform?b.transform[4]:0));
      const lead = (row[0].str||'').trim();
      const m = lead.match(/^\s*[（(]?\s*(\d{1,3})(?:[\．.、）)\s]|$)/);
      if(m && m[1] === sNo){
        const yFrac = 1 - y/pageH;   // 转成「距顶部比例」，与 positions.json 约定一致
        if(yFrac < 0.04 || yFrac > 0.95) continue;   // 跳过页眉/页脚行
        const rest = lead.slice(m[0].length).trim();
        if(!rest && parseInt(m[1],10) > 99 && m[0] === sNo) continue; // 纯数字(无标点)且数值大：标题/水印，跳过
        return {pageIdx:i, yFrac: Math.max(0, Math.min(1, yFrac))};
      }
    }
  }
  return null;
}
// 取得题号 no 的位置：优先运行时缓存/精确检索，其次离线 positions.json 兜底
async function findQuestion(no){
  const sNo = String(no);
  if(runtimePos[sNo]) return runtimePos[sNo];
  if(curPdfDoc){
    const pos = await searchPdfForQuestion(no);
    if(pos){ runtimePos[sNo] = pos; return pos; }
  }
  if(viewingAnswer && curAnswerPositions[sNo]) return curAnswerPositions[sNo];
  return curPositions[sNo] || null;
}
// 点击答题卡题号 / 题号导航条 → 实时检索并滚动到试卷对应题目（学生版/解析版均可）
async function jumpToQuestion(no){
  const pos = await findQuestion(no);
  if(!pos) return;
  const pageIdx = pos.pageIdx, yFrac = (typeof pos.yFrac === 'number') ? pos.yFrac : 0;
  const v = $('#pdfViewer');
  if(!v) return;
  const canvases = v.querySelectorAll('canvas');
  if(!canvases.length) return;
  const c = canvases[pageIdx - 1];
  if(!c) return;
  const scroller = findScroller(c);
  const rect = c.getBoundingClientRect();
  let base;
  if(scroller === window){ base = rect.top + window.scrollY; }
  else { const sr = scroller.getBoundingClientRect(); base = rect.top - sr.top + scroller.scrollTop; }
  const target = base + yFrac * rect.height - 12;
  scrollToY(scroller, Math.max(0, target));
  // 短暂高亮该题号所在画布，便于定位
  c.style.transition = 'box-shadow .2s'; c.style.boxShadow = '0 0 0 3px var(--primary)';
  setTimeout(()=>{ c.style.boxShadow = ''; }, 1200);
}
// 从已渲染 PDF 的文本实时扫描「行首题号」，得到当前试卷题号全集（比离线更全，含重排/填空等）
async function collectQuestionNumbers(){
  if(!curPdfDoc) return [];
  const nums = new Set();
  for(let i=1;i<=curPdfDoc.numPages;i++){
    let page, tc;
    try{ page = await curPdfDoc.getPage(i); tc = await page.getTextContent(); }
    catch(e){ continue; }
    const v = page.getViewport({scale:1}); const pageH = v.height || 1;
    const lines = {};
    for(const it of tc.items){
      if(!it.str || !it.str.trim()) continue;
      const y = it.transform ? it.transform[5] : 0;
      const key = Math.round(y/3)*3;
      (lines[key] = lines[key] || []).push(it);
    }
    const ys = Object.keys(lines).map(Number).sort((a,b)=>b-a);
    for(const y of ys){
      const row = lines[y].sort((a,b)=>(a.transform?a.transform[4]:0)-(b.transform?b.transform[4]:0));
      const lead = (row[0].str||'').trim();
      const m = lead.match(/^\s*[（(]?\s*(\d{1,3})(?:[\．.、）)\s]|$)/);
      if(m){
        const yFrac = 1 - y/pageH;
        if(yFrac < 0.04 || yFrac > 0.95) continue;   // 跳过页眉/页脚
        const rest = lead.slice(m[0].length).trim();
        const n = parseInt(m[1],10);
        if(!(1<=n && n<=300)) continue;
        if(!rest && n > 99 && m[0] === String(n)) continue;   // 纯数字(无标点)且数值大：标题/水印，跳过
        nums.add(n);
      }
    }
  }
  return [...nums].sort((a,b)=>a-b);
}
// 渲染完成后异步刷新题号导航条（用实时扫描得到的全集，更准确更全）
async function rebuildNavAsync(){

}
// 题号导航条：把当前试卷的全部题号渲染成可点击 chip（覆盖所有 PDF 试卷，含无答题卡的纯浏览卷）

// ===== 截题问 AI：框选试卷区域截图，直接送到父窗口的 AI 提问 =====
(function(){
  const btn = $('#cropBtn');
  if(!btn) return;
  btn.addEventListener('click', startCrop);

  function startCrop(){
    const host = document.querySelector('#pdfWrap .pdf-col') || $('#pdfViewer');
    if(!host) return;
    if(!host.querySelectorAll('canvas').length){ alert('当前没有可截取的试卷页面，请先打开一份试卷'); return; }
    if(document.getElementById('cropLayer')) document.getElementById('cropLayer').remove();
    const hr = host.getBoundingClientRect();
    const layer = document.createElement('div');
    layer.id = 'cropLayer';
    Object.assign(layer.style, {
      position:'fixed', left:hr.left+'px', top:hr.top+'px', width:hr.width+'px', height:hr.height+'px',
      zIndex:60, cursor:'crosshair', background:'rgba(20,30,50,.10)', boxSizing:'border-box'
    });
    document.body.appendChild(layer);
    const tip = document.createElement('div');
    tip.textContent = '按住拖动框选要问的题目，松手即截取；按 Esc 取消';
    tip.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:6px 12px;border-radius:var(--radius);z-index:61;pointer-events:none;';
    document.body.appendChild(tip);

    let sx=0, sy=0, dragging=false, rect=null;
    const pos = e => { const p = (e.touches && e.touches[0]) ? e.touches[0] : e; return { x:p.clientX, y:p.clientY }; };
    function down(e){
      e.preventDefault();
      const pp = pos(e); dragging = true; sx = pp.x; sy = pp.y;
      rect = document.createElement('div');
      Object.assign(rect.style, { position:'absolute', border:'2px solid #2b6cff', background:'rgba(43,108,255,.12)', left:'0px', top:'0px', width:'0px', height:'0px' });
      layer.appendChild(rect);
    }
    function move(e){
      if(!dragging) return;
      if(e.cancelable) e.preventDefault();
      const pp = pos(e);
      const x = Math.min(sx, pp.x), y = Math.min(sy, pp.y), w = Math.abs(pp.x - sx), h = Math.abs(pp.y - sy);
      rect.style.left = (x - hr.left) + 'px'; rect.style.top = (y - hr.top) + 'px';
      rect.style.width = w + 'px'; rect.style.height = h + 'px';
    }
    function up(e){
      if(!dragging) return; dragging = false;
      const pp = pos(e.changedTouches ? e.changedTouches[0] : e);
      const x = Math.min(sx, pp.x), y = Math.min(sy, pp.y), w = Math.abs(pp.x - sx), h = Math.abs(pp.y - sy);
      cleanup();
      if(w < 12 || h < 12) return;   // 太小视为取消
      const url = captureRegion(x, y, w, h);
      if(!url) return;
      try{ window.parent.postMessage({ type:'exam-screenshot', image:url }, '*'); }catch(err){}
      const fb = document.createElement('div');
      fb.textContent = '已截取，去 AI 提问 →';
      fb.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#2b6cff;color:#fff;font-size:13px;padding:8px 14px;border-radius:var(--radius);z-index:80;';
      document.body.appendChild(fb);
      setTimeout(()=>{ fb.remove(); }, 1600);
    }
    function onKey(e){ if(e.key === 'Escape') cleanup(); }
    function cleanup(){
      if(layer.parentNode) layer.remove(); if(tip.parentNode) tip.remove();
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.removeEventListener('touchmove', move, { passive:false });
      document.removeEventListener('touchend', up);
      document.removeEventListener('keydown', onKey);
    }
    layer.addEventListener('mousedown', down);
    layer.addEventListener('touchstart', down, { passive:false });
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    document.addEventListener('touchmove', move, { passive:false });
    document.addEventListener('touchend', up);
    document.addEventListener('keydown', onKey);
  }

  function captureRegion(vx, vy, vw, vh){
    const host = document.querySelector('#pdfWrap .pdf-col') || $('#pdfViewer');
    const canvases = host.querySelectorAll('canvas');
    const slices = [];
    canvases.forEach(c=>{
      const r = c.getBoundingClientRect();
      const ix = Math.max(vx, r.left), iy = Math.max(vy, r.top);
      const ix2 = Math.min(vx+vw, r.right), iy2 = Math.min(vy+vh, r.bottom);
      if(ix2 <= ix || iy2 <= iy) return;
      slices.push({
        c, iy,
        sx:(ix - r.left) * (c.width / r.width), sy:(iy - r.top) * (c.height / r.height),
        sw:(ix2 - ix) * (c.width / r.width), sh:(iy2 - iy) * (c.height / r.height)
      });
    });
    if(!slices.length) return null;
    slices.sort((a,b)=> a.iy - b.iy);
    const outW = Math.max(1, Math.round(Math.max.apply(null, slices.map(s=>s.sw))));
    const out = document.createElement('canvas');
    out.width = outW;
    out.height = Math.max(1, Math.round(slices.reduce((h2,s)=> h2 + s.sh, 0)));
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,out.width,out.height);
    let dy = 0;
    slices.forEach(s=>{
      const dw = s.sw, dh = s.sh, dx = (out.width - dw) / 2;
      try{ ctx.drawImage(s.c, s.sx, s.sy, s.sw, s.sh, dx, dy, dw, dh); }catch(e){}
      dy += dh;
    });
    return out.toDataURL('image/png');
  }
})();

const GLUE_RE=/[A-Za-z]{8,}/g;
function deGlue(s){
  if(!glueMap) return s;
  return String(s).replace(GLUE_RE, w => glueMap[w] || w);
}
function deGlueDeep(v, depth){
  if(depth>8 || v==null) return v;
  if(typeof v==='string') return deGlue(v);
  if(Array.isArray(v)){ for(let i=0;i<v.length;i++) v[i]=deGlueDeep(v[i],depth+1); return v; }
  if(typeof v==='object'){
    for(const k in v){ if(k==='title') continue; v[k]=deGlueDeep(v[k],depth+1); }   // title 是出题库索引键，不能改
    return v;
  }
  return v;
}

    .replace(/\*\*([^*\n]+)\*\*/g,'$1')

// 卷首标题行（如「Unit1Lookitup! 单元核心知识」）会被 PDF 抽取粘进正文块里，读的时候要去掉
function isTitleLine(line){
  const s=String(line||'').trim();
  if(!s || s.length>50) return false;
  if(/[。？；]/.test(s)) return false;
  const words=(s.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length;
  if(words>6) return false;
  return /^unit\s*\d+/i.test(s);
}
function renderTextBlockHtml(text){
  if(!text) return '';
  let lines = String(text).split(/\n/).map(s=>s.trim()).filter(Boolean);
  lines = lines.filter(s=>!isTitleLine(s));
  if(!lines.length) return '';
  const out = [];
  for(let i=0;i<lines.length;i++){
    let line = lines[i];
    // 词汇行（含音标 /.../）若末尾释义被换行截断，则把下一行纯中文并入同一词条
    if(/\/[^\/]+\//.test(line) && /[A-Za-z]/.test(line)){
      const entries = parseVocabLine(line);
      const last = entries[entries.length-1];
      if(last && !last.mean){
        const nx = lines[i+1];
        if(nx && !/\/[^\/]+\//.test(nx) && /^[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef\s]+$/.test(nx)){
          line = line + ' ' + nx;
          i++;
        }
      }
    }
    out.push(formatTextLine(line));
  }
  return `<div class="know-read-t">${out.join('')}</div>`;
}
// 把一行词汇拆成「单词 / 音标 / 词性 / 解释」四段
function parseVocabLine(line){
  const entries = [];
  const re = /([A-Za-z][\w'’.-]*)\s*\/([^/]+)\/\s*([\s\S]*?)(?=\s+[A-Za-z][\w'’.-]*\s*\/|$)/g;
  let m;
  while((m = re.exec(line)) !== null){
    const word = m[1].trim();
    const phon = m[2].trim();
    const rest = m[3].trim();
    let pos='', mean='';
    const pm = rest.match(/^([a-z][a-z.\s]*?\.)\s*([\u4e00-\u9fa5][\s\S]*)?$/i);
    if(pm){ pos = pm[1].trim(); mean = pm[2] ? pm[2].trim() : ''; }
    else if(/^[\u4e00-\u9fa5]/.test(rest)){ mean = rest; }
    else { pos = rest; }
    entries.push({word, phon, pos, mean});
  }
  return entries;
}
function vocabChipHtml(e){
  // 四段必须都输出（哪怕是空的），否则网格列会错位

// PDF 抽取常丢空格（dieout / hewas / DaVinci / ",dinosaurs"）——显示前做最小修复
// 只做两件百分百安全的事：① 英文标点后补空格；② 小写紧跟大写处断词（品牌名除外）
const GLUE_KEEP=/^(iPhone|iPad|iPod|iMac|iOS|iTunes|eBay|macOS|YouTube|WhatsApp|TikTok|WordPress|PayPal|LinkedIn|GitHub|OpenAI|PowerPoint)$/;
function deGlueEn(s){
  let t=String(s==null?'':s);
  // 省略号 / 连续标点（... ?!）后面不补空格，否则 as...as... 会被拆坏
  t=t.replace(/([,.;:!?])(?=[A-Za-z])/g, (m,p,idx,whole)=> (idx>0 && /[.?!]/.test(whole[idx-1])) ? m : p+' ');
  t=t.replace(/[A-Za-z]+/g, w=> GLUE_KEEP.test(w) ? w : w.replace(/([a-z])([A-Z])/g,'$1 $2'));
  return t;
}
// 中英句对识别：英文句子 + 中文译文。这类必须分两行，不能拆成并排小标签
function splitSentencePair(s){
  const re=/[.?!。？！]/g; let m;
  while((m=re.exec(s))!==null){
    let j=m.index+1;
    while(j<s.length && /[\s（(“‘"'《]/.test(s[j])) j++;
    if(j>=s.length) break;
    if(!/[\u4e00-\u9fa5]/.test(s[j])) continue;      // 句子结束后的第一处非空白必须是中文
    const en=s.slice(0,m.index+1).trim();
    if(/[\u4e00-\u9fa5]/.test(en)) continue;        // 英文句子部分不能再夹中文
    const enWords=(en.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length;
    if(enWords<3) continue;                          // 太短，多半是 "e.g." 之类，不是句子
    const zh=s.slice(m.index+1).trim();
    const zhChars=(zh.match(/[\u4e00-\u9fa5]/g)||[]).length;
    if(zhChars>=3) return {en:en, zh:zh};
  }
  return null;
}
function formatTextLine(line){
  const s = line.trim();
  if(!s) return '';
  // 词汇行：含音标 /.../ 且含拉丁字母，拆成四段（单词 / 音标 / 词性 / 解释）
  if(/\/[^\/]+\//.test(s) && /[A-Za-z]/.test(s)){
    return vocabLineHtml(s);
  }
  // 行首标签：题号/序号（1. / （一） / (1)），或「例句：/知识点 4：」这类提示词
  const lm = s.match(/^(（?[0-9]+[.、)）]?|（[一二三四五六七八九十]+）|\(\d+\)|(?:例句|例如|知识点|拓展|考点|注意|提示|用法|辨析)\s*[0-9一二三四五六七八九十]*\s*[：:])\s*/);
  let label='', rest=s;
  if(lm){ label = lm[1]; rest = s.slice(lm[0].length); }
  const labelHtml = label ? `<b class="know-num">${escapeHtml(label)}</b> ` : '';
  // 中英句对：英文一行 + 中文译文一行
  const pair = splitSentencePair(rest);
  if(pair){
    return `<p class="know-read-line pair-en">${labelHtml}${escapeHtml(deGlueEn(pair.en))}</p>`
      +`<p class="know-read-line pair-zh">${escapeHtml(pair.zh)}</p>`;
  }
  // 把“中文+英文”成对出现的短语/词汇行拆成两列对齐的词汇表（英文列 / 中文列）
  const tokens = rest.match(/[\u4e00-\u9fa5；，、]+|[^\s\u4e00-\u9fa5；，、]+/g) || [rest];
  const cjk = tokens.filter(t=>/[\u4e00-\u9fa5]/.test(t));
  const latin = tokens.filter(t=>/[A-Za-z]/.test(t));
  if(cjk.length>=2 && latin.length>=2){
    const items=[];
    const re=/([\u4e00-\u9fa5；，、]+)\s*([^\u4e00-\u9fa5；，、]+)|([^\u4e00-\u9fa5；，、]+)\s*([\u4e00-\u9fa5；，、]+)/g;
    let m; while((m=re.exec(rest))!==null){
      const item=(m[1]!==undefined)?(m[1]+' '+m[2]):(m[3]+' '+m[4]);
      items.push(item.trim().replace(/\s+/g,' '));
    }
    // 保险：拆出来的每一项都必须又短、英文词又少，才认定是词条清单；否则说明这行其实是句子，按段落显示
    const ok= items.length>=2 && items.every(it=> it.length<=32 && (it.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length<=4);
    if(ok){
      // 拆成 {en, zh, mid}；mid 是省略号等既非英文也非中文的残留
      let pairs=items.map(it=>{
        const en=(it.match(/[A-Za-z][A-Za-z'’.\-]*/g)||[]).join(' ').replace(/\s+/g,' ').trim();
        const zh=(it.match(/[\u4e00-\u9fa5；，、]/g)||[]).join('').trim();
        const mid=it.replace(/[A-Za-z][A-Za-z'’.\-]*/g,'').replace(/[\u4e00-\u9fa5；，、]/g,'').trim();
        return {en, zh, mid};
      });
      // 中文释义被 PDF 换行截断时，会多出一条「只有中文没有英文」的残项 —— 并到后一条的中文里
      for(let k=pairs.length-1;k>=0;k--){
        const p0=pairs[k];
        if(!p0.en && p0.zh && k+1<pairs.length){
          const nxt=pairs[k+1];
          nxt.zh = p0.zh + (p0.mid||'') + nxt.zh;
          pairs.splice(k,1);
        }else if(!p0.en && !p0.zh){
          pairs.splice(k,1);
        }
      }
      // 排除「看着像词条、其实是语法讲解句子」的行，别把讲解句排成两列表格
      const isList = pairs.length>=2 && pairs.some(p0=>p0.en)
        && !/[。？！]\s*$/.test(rest)                                   // 以句号/问号收尾的是句子
        && pairs.every(p0=>{
             const z=p0.zh;
             if(!z) return true;
             if(z.length<2 || z.length>14) return false;               // 中文过短或过长都不是释义
             if(/^(和|的|了|是|在|与|及|或|而|就|也|都|很|把|被|对|从|向|给|让|使|等|中|上|下|里|后|前|之|其|该|此|本|含有|带有|表示|修饰)$/.test(z)) return false;
             if(/^[的]/.test(z)) return false;
             return true;
           });
      if(isList){
        const cells=pairs.map(p0=>`<span class="ph-en">${escapeHtml(deGlueEn(p0.en))}</span><span class="ph-zh">${escapeHtml(p0.zh)}</span>`).join('');
        return `<div class="know-read-line phrase-line">${labelHtml}<div class="ph-grid">${cells}</div></div>`;
      }
    }
  }
  return `<p class="know-read-line${label?' has-num':''}">${labelHtml}${escapeHtml(deGlueEn(rest))}</p>`;
}
// 卷首标题常被 PDF 抽取切成一个独立块（如「Unit1Lookitup! 单元核心知识」），它不是可背内容
function isHeadingOnly(b){
  const raw=String((b&&b.text)||'');
  const t=raw.replace(/\s+/g,' ').trim();
  if(!t) return true;                                     // 空块
  if(t.length<14) return true;                            // 太短，没内容
  const lines=raw.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const cjk=(t.match(/[\u4e00-\u9fa5]/g)||[]).length;
  if(lines.length<=1 && t.length<40 && cjk<12) return true;   // 单行、短、中文很少 → 标题
  if(!/[\u4e00-\u9fa5]/.test(t) && (t.match(/[A-Za-z]+/g)||[]).length<=4) return true;
  return false;
}

function bindKnow(){

  p.querySelectorAll('[data-mode]').forEach(b=> b.onclick=()=>{ knowMode=b.dataset.mode; knowFlipped=false; renderKnowPanel(); });
  p.querySelectorAll('[data-sub]').forEach(b=> b.onclick=()=>{ knowSub=b.dataset.sub; renderKnowPanel(); });
  const card=$('#knowCard'); if(card) card.onclick=knowToggleFlip;
  const f=$('#knowFlip'); if(f) f.onclick=knowToggleFlip;
  const prev=$('#knowPrev'); if(prev) prev.onclick=()=>knowNav(-1);
  const next=$('#knowNext'); if(next) next.onclick=()=>knowNav(1);
  const shuf=$('#knowShuffle'); if(shuf) shuf.onclick=knowShuffle;
  // 用一用 · 词条模式：在这里直接翻页
  const ep=$('#knowExtPrev'); if(ep) ep.onclick=()=>knowExtNav(-1);
  const en2=$('#knowExtNext'); if(en2) en2.onclick=()=>knowExtNav(1);
  const es=$('#knowExtShuffle'); if(es) es.onclick=knowShuffle;
  const grade=$('#knowGrade'); if(grade) grade.onclick=knowGrade;
  const reveal=$('#knowReveal'); if(reveal) reveal.onclick=knowReveal;
  const next2=$('#knowNext2'); if(next2) next2.onclick=()=>knowNav(1);
  const ext=$('#knowExtGen'); if(ext) ext.onclick=knowExtendGen;
  // text 型「用一用」：切换要点（每个要点单独出题）+ 换一组
  p.querySelectorAll('[data-scope]').forEach(b=> b.onclick=()=>{
    quizScope=parseInt(b.dataset.scope,10); if(isNaN(quizScope)) quizScope=-1;
    quizRound=1; renderKnowPanel();
  });
  const more=$('#knowExtMore'); if(more) more.onclick=()=>{
    quizRound++; knowExtendGenText($('#knowExtendOut'), true);
  };
  // text 型：阅读遮罩 / 抽背显示与自查
  const rh=document.getElementById('knowReadHide'); if(rh) rh.onclick=()=>{ document.querySelectorAll('.know-read-t').forEach(e=> e.style.display='none'); };
  const rs=document.getElementById('knowReadShow'); if(rs) rs.onclick=()=>{ document.querySelectorAll('.know-read-t').forEach(e=> e.style.display=''); };
  document.querySelectorAll('.know-rec-show').forEach(b=> b.onclick=()=>{
    const i=b.dataset.i;
    const a=$('#reca'+i); if(a) a.style.display='block';
    const pr=$('#recp'+i); if(pr) pr.style.display='none';
    $('#recb'+i).innerHTML='<button class="know-rec-ok" data-i="'+i+'">记住了</button><button class="know-rec-no" data-i="'+i+'">没记住</button>';
  });
  // 「记住了 / 没记住」是点「显示」之后才生成的按钮，事先绑不到 —— 用事件委托（只挂一次）
  if(!p.dataset.recDelegated){
    p.dataset.recDelegated='1';
    p.addEventListener('click', ev=>{
      const ok=ev.target.closest && ev.target.closest('.know-rec-ok');
      const no=ev.target.closest && ev.target.closest('.know-rec-no');
      if(ok){ knowScore.right++; markRec(ok.dataset.i, true); }
      else if(no){ knowScore.wrong++; markRec(no.dataset.i, false); }
    });
  }
}
function knowToggleFlip(){
  knowFlipped=!knowFlipped;
  const b=$('#knowBack'); if(b) b.style.display=knowFlipped?'block':'none';
  const f=$('#knowFlip'); if(f) f.textContent=knowFlipped?'翻回正面':'翻到背面';
}
function knowNav(d){
  knowIdx=(knowIdx+d+knowData.items.length)%knowData.items.length;
  knowFlipped=false;
  renderKnowPanel();
}
function knowShuffle(){
  for(let i=knowOrder.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=knowOrder[i]; knowOrder[i]=knowOrder[j]; knowOrder[j]=t; }
  knowIdx=0; renderKnowPanel();
}
function knowGrade(){
  const inputs=document.querySelectorAll('.know-inp');
  let allOk=true, right=0, wrong=0, unans=0, answered=0;
  inputs.forEach(inp=>{
    const ans=decodeURIComponent(inp.dataset.ans||'');
    const val=(inp.value||'').trim();
    const ok=knowMatch(inp.value, ans);
    inp.classList.toggle('g-ok', ok); inp.classList.toggle('g-bad', !ok);
    if(!ok) allOk=false;
    if(!val){ unans++; } else { answered++; if(ok) right++; else wrong++; }
  });
  knowScore[allOk?'right':'wrong']++;
  const res=$('#knowTestResult');
  if(res){ res.className='know-result '+(allOk?'ok':'bad'); res.textContent= allOk?'✓ 全对' : '✗ 有错。对照标出的正确答案再记一遍。'; }
  // 学习记录：测一测成绩（全部空着不算一次测验）
  if(answered>0) trackQuiz({src:'know', mod:curPaperLabel || '知识互动', right:right, wrong:wrong, unans:unans, total:right+wrong});
}
function knowReveal(){
  document.querySelectorAll('.know-inp').forEach(inp=>{ inp.value=decodeURIComponent(inp.dataset.ans||''); inp.classList.remove('g-bad'); inp.classList.add('g-ok'); });
}
// 举一反三：懒加载云端 SDK，调用云端 LLM 生成例句；不可用时给出友好提示并引导到 AI 答疑
function ensureKnowCloud(){
  return new Promise((resolve)=>{
    if(knowCloudInit){ resolve(knowCloudReady); return; }
    knowCloudInit=true;
    const done=()=>{ resolve(knowCloudReady); };
    if(window.WorkBuddyCloud){ initKnowCloud().then(done); return; }
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js';
    s.onload=()=> initKnowCloud().then(done);
    s.onerror=()=>{ knowCloudReady=false; done(); };
    document.head.appendChild(s);
  });
}
async function initKnowCloud(){
  try{ knowCloud = window.WorkBuddyCloud.createWorkBuddyCloud({endpoint:KNOW_CLOUD_CFG.endpoint, publishableKey:KNOW_CLOUD_CFG.publishableKey}); }
  catch(e){ knowCloud=null; knowCloudReady=false; return; }
  try{ knowModels = await knowCloud.llm.models.list(); knowCloudReady=true; }
  catch(e){ knowCloudReady=false; }
}
// 只挑「文本对话」模型：图像模型等条目只有 id/name，没有任何能力字段，选了不会回答
// 默认模型必须挑快而稳的：auto 会先跑完整条推理链，实测同一个出题请求 150 秒都不返回，
// 而 deepseek-v4-flash 2.6 秒就出结果——学生在等题，不能默认走推理链。
const FAST_MODELS=['deepseek-v4-flash','hy3','deepseek-v4'];
function pickChatModel(){
  const list=(knowModels||[]).filter(m=>!m.disabled);
  const chat=list.filter(m=> m.id==='auto' || m.maxInputTokens || m.maxOutputTokens || m.supportsToolCall || m.vendor);
  const pool=chat.length?chat:list;
  for(const id of FAST_MODELS){ const hit=pool.find(m=>m.id===id); if(hit) return hit; }
  return pool.find(m=> !m.onlyReasoning && !m.supportsReasoning) || pool[0] || null;
}

// ===== 统一 AI 通路 =====
// ① 云端直连：仅 WorkBuddy 站自己的域名在云端白名单内，直连最快（走 SDK，可流式）
// ② 自建中继：GitHub Pages 等外部域名的请求会被云端 403（Origin 白名单 + 无 CORS 头），
//    改由中继服务做「服务端转发」——服务端之间没有浏览器 Origin，云端正常放行。
// ③ 两者都不可用时给出明确提示（不再假装「仅 WorkBuddy 版可用」）
const AI_RELAY_BASE = (function(){
  try{ return localStorage.getItem('aiRelayBase') || 'https://hj8-english-ai-relay.app.workbuddy.host'; }
  catch(e){ return 'https://hj8-english-ai-relay.app.workbuddy.host'; }
})();
let aiRoute=null, aiRouteProbe=null;
async function aiPickRoute(){
  if(aiRoute) return aiRoute;
  if(aiRouteProbe) return aiRouteProbe;
  aiRouteProbe=(async()=>{
    // ① 云端直连：只有同源才试。云端只放行自身域名的 Origin，GitHub Pages 等外部域名
    //    直连必被 CORS 拦下；已配中继时跳过这一步，省一个往返也不刷控制台错误。
    let sameOrigin=false;
    try{ sameOrigin=(new URL(KNOW_CLOUD_CFG.endpoint)).origin===location.origin; }catch(e){}
    if(sameOrigin || !AI_RELAY_BASE){
      try{
        const ok=await ensureKnowCloud();
        if(ok && knowCloudReady && knowCloud){ aiRoute='cloud'; return aiRoute; }
      }catch(e){}
    }
    // ② 自建中继（顺带把模型列表也取回来，让模型选择在两站表现一致）
    if(AI_RELAY_BASE){
      try{
        const base=AI_RELAY_BASE.replace(/\/$/,'');
        const r=await fetch(base+'/models',{cache:'no-store'});
        if(r.ok){
          const j=await r.json();
          const list=Array.isArray(j)?j:(j&&(j.models||j.data))||[];
          if(list.length){ knowModels=list; aiRoute='relay'; return aiRoute; }
        }
      }catch(e){}
    }
    aiRoute='';
    return aiRoute;
  })();
  return aiRouteProbe;
}
// 统一的对话补全：两种通路都返回最终文本，onDelta 有值时逐段回调（用于流式显示）
// 60 秒兜底超时：模型卡住时给出明确失败，而不是让学生一直看着「出题中…」
const AI_TIMEOUT_MS=60000;
async function aiComplete(messages, onDelta){
  const route=await aiPickRoute();
  const model=pickChatModel();
  const ac=new AbortController();
  const to=setTimeout(()=>{ try{ ac.abort(); }catch(e){} }, AI_TIMEOUT_MS);
  try{
    if(route==='cloud'){
      let text='';
      for await(const c of knowCloud.llm.chat.completions.create({model:(model&&model.id)||'deepseek-v4-flash', messages, stream:true, temperature:0.6, signal:ac.signal})){
        const d=c.choices?.[0]?.delta;
        if(d && d.content){ text+=d.content; if(onDelta) onDelta(d.content); }
      }
      if(!text.trim()) throw new Error('EMPTY_REPLY');
      return text;
    }
    if(route==='relay'){
      const r=await fetch(AI_RELAY_BASE.replace(/\/$/,'')+'/ai',{
        method:'POST', headers:{'Content-Type':'application/json'}, signal:ac.signal,
        body:JSON.stringify({model:(model&&model.id)||'deepseek-v4-flash', messages, stream:true, temperature:0.6})
      });
      if(!r.ok){ const t=await r.text().catch(()=> ''); throw new Error('HTTP '+r.status+' '+t.slice(0,120)); }
      const raw=await r.text();
      let text='';
      raw.split(/\r?\n/).forEach(line=>{
        const s=line.trim();
        if(!s.startsWith('data:')) return;
        const p=s.slice(5).trim();
        if(!p || p==='[DONE]') return;
        let d; try{ d=JSON.parse(p); }catch(e){ return; }
        const c=d.choices&&d.choices[0]&&d.choices[0].delta&&d.choices[0].delta.content;
        if(!c) return;
        // 中继偶尔会透传非标准事件（如错误说明），过滤掉明显的英文提示句
        if(/^(I waited|I'm sorry|Sorry,)/i.test(c)) return;
        text+=c; if(onDelta) onDelta(c);
      });
      if(!text.trim()) throw new Error('EMPTY_REPLY');
      return text;
    }
    throw new Error('NO_BACKEND');
  } finally { clearTimeout(to); }
}
function fallbackExtend(word){
  return '这个词还没收进本地例句库，联网 AI 也暂时没连上。\n你可以：\n① 自己用「'+word+'」造个简单句；\n② 稍后重试，或在右下角「AI 答疑」里提问：“请用 '+word+' 造 3 个由浅入深的句子并翻译”。';
}
function fallbackExtendText(){
  return '这份资料还没内置出题库，联网 AI 也暂时没连上。\n你可以稍后重试，或在右下角「AI 答疑」里直接提问。';
}
// ===== 用一用：本地例句库（秒查） + 云端兜底 =====
function kbEnOnly(s){ return String(s||'').replace(/[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]+/g,' ').replace(/[^A-Za-z' -]+/g,' ').replace(/\s+/g,' ').trim(); }
function kbPosFix(s){ return String(s||'').replace(/([A-Za-z]{2})((?:n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int|interj)\.)/g,'$1 $2'); }
function kbCode(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9']/g,''); }
// 例句库键：与生成脚本 _gen_kb.js 中的规则保持一致，改动需同步两边
function knowExtendKeyItem(item){
  if(knowCfg.kind==='verb') return kbCode(item['原形']||'');
  if(knowCfg.kind==='vocab') return kbCode(item['英文']||'');
  const t=(kbEnOnly(kbPosFix(item[knowCfg.promptKey]||'')).split(' ')[0]||'').toLowerCase();
  return t;
}
async function ensureExKb(){
  if(exKbTried) return exKb;
  exKbTried=true;
  try{
    const r=await fetch('knowledge-data/例句库.json',{cache:'no-store'});
    if(r.ok){ const j=await r.json(); exKb=(j&&j.entries)||null; }
  }catch(e){ exKb=null; }
  return exKb;
}
function kbEntryHtml(e){
  const pre=(s,tag)=>{ s=String(s||'').trim(); return /^(注意|切记|记住|要点|提示|用法要点|易错)/.test(s) ? s : tag+s; };
  const exs=(e.ex||[]).map((x,i)=>
    `<div class="kb-ex"><span class="kb-n">${i+1}</span><div class="kb-ex-body">`
    +`<div class="kb-en">${escapeHtml(x.en)}</div>`
    +`<div class="kb-zh">${escapeHtml(x.zh)}</div>`
    +(x.note?`<div class="kb-note">${escapeHtml(pre(x.note,'要点：'))}</div>`:'')
    +`</div></div>`).join('');
  // 词条名已由上方词条头显示，这里不再重复；脚注交代来源，读起来像一份有出处的资料
  return (e.forms?`<div class="kb-forms">${escapeHtml(e.forms)}</div>`:'')
    +(e.tip?`<div class="kb-tip">${escapeHtml(pre(e.tip,'注意：'))}</div>`:'')
    +exs
    +`<div class="kb-foot">共 ${(e.ex||[]).length} 句 · 本地例句库 · 离线秒出</div>`;
}
// ===== 用一用 · 文本资料出小题 =====
// 优先级：本地出题库（秒出） → 已生成过的缓存 → 复用正在进行中的请求（切走再回来不重新等） → 联网生成
function quizWaitMsg(){ return '正在联网出题，大约 10-20 秒。\n这段时间可以切去看别的资料，回来结果还在，不用重新等。'; }
async function quizBaked(key){
  const qk=await ensureQuizKb();
  const hit=qk&&key?qk[key]:null;
  return (hit&&hit.t)?hit.t:'';
}
// 出题的资料范围：选定要点 → 只送该要点；未选 → 送整份资料的要点
function quizCtx(){
  const blocks=textBlocks();
  if(quizScope>=0 && blocks[quizScope]){
    const b=blocks[quizScope];
    return (b.title?('【'+b.title+'】\n'):'')+String(b.text||'');
  }
  return blocks.map(b=>(b.title?('【'+b.title+'】\n'):'')+(b.text||'')).join('\n\n');
}
const QUIZ_N=6;
const QUIZ_SYS='你是初中英语辅导老师。下面是一份初二英语复习资料的某个要点，请只围绕这个要点出 '+QUIZ_N+' 道小题（含答案），适合初二学生。'
  +'要求：① '+QUIZ_N+' 道题从不同角度考同一个要点（如单词拼写、词义辨析、固定搭配、句型转换、语法选择、完成句子），不要重复考同一个点；'
  +'② 每题先写题目，再在下一行写「答案：…」；'
  +'③ 题目里不要出现「要点」「资料」「片段」「根据上面」这类字样，直接写题目本身；'
  +'④ 只输出这 '+QUIZ_N+' 道题，不要标题、不要解释、不要 markdown 代码块、不要多余空行。';
function quizStart(key){
  if(quizInflight[key]) return quizInflight[key];
  const ctx=(quizCtx()||'').slice(0, 6000);
  const job=(async()=>{
    try{
      const text=await aiComplete([
        {role:'system', content:QUIZ_SYS},
        {role:'user', content:'要点内容：\n'+ctx+'\n\n请围绕上面这个要点出 '+QUIZ_N+' 道小题并附答案。'}
      ]);
      return String(text||'').trim();
    }catch(e){ return ''; }
  })();
  quizInflight[key]=job;
  job.then(v=>{ if(v){ quizCache[key]=v; quizLsSet(key,v); } delete quizInflight[key]; },
          ()=>{ delete quizInflight[key]; });
  return job;
}
function quizShow(out, text, cls){
  if(!out) return;
  out.className='know-ext-out '+(cls||'know-ext-ok');
  out.textContent=plainify(deGlue(text));   // 出题库/联网题目同样过一遍粘连修正与 markdown 抹平
}
// force=true 表示「换一组」：跳过内置题库与旧缓存，强制重新出题
async function knowExtendGenText(out, force){
  const key=quizCacheKey();
  if(out){ out.className='know-ext-out'; out.textContent='出题中…'; }
  if(!force){
    const baked=await quizBaked(quizKey());
    if(baked){ quizCache[key]=baked; quizShow(out,baked); return; }
    const saved=quizCache[key]||quizLsGet(key);
    if(saved){ quizCache[key]=saved; quizShow(out,saved); return; }
  }
  quizShow(out, quizWaitMsg(), '');
  const v=await quizStart(key);
  if(v) quizShow(out, quizCache[key]||v);
  else quizShow(out, fallbackExtendText(), 'know-ext-fallback');
}
// 切回「用一用」时把已有结果/正在等的进度接回来（不会自动发起新请求）
async function hydrateExtendOut(){
  try{
    if(!knowCfg || knowMode!=='extend') return;
    if(knowCfg.kind!=='text'){ await knowExtAutoShow(); return; }
    const out=$('#knowExtendOut'); if(!out) return;
    const key=quizCacheKey();
    const baked=await quizBaked(quizKey());
    if(baked){ quizShow(out,baked); return; }
    const saved=quizCache[key]||quizLsGet(key);
    if(saved){ quizCache[key]=saved; quizShow(out,saved); return; }
    if(quizInflight[key]){
      quizShow(out, quizWaitMsg(), '');
      const v=await quizInflight[key];
      if(v) quizShow(out, quizCache[key]||v);
      else quizShow(out, fallbackExtendText(), 'know-ext-fallback');
    }
  }catch(e){}
}
async function knowExtendGen(){
  const out=$('#knowExtendOut');
  let word;
  // ① 非文本型：先查本地例句库，命中就秒出，不联网
  if(knowCfg.kind!=='text'){
    const item=knowData.items[knowOrder[knowIdx]];
    word=knowExtendWord(item);
    const ck=knowExtendKeyItem(item);
    out.className='know-ext-out'; out.textContent='查询中…';
    const kb=await ensureExKb();
    const hit=kb && kb[ck];
    if(hit && (hit.ex||[]).length){
      out.className='know-ext-out know-ext-ok';
      out.innerHTML=kbEntryHtml(hit);
      return;
    }
    if(exAiCache[ck]){
      out.className='know-ext-out know-ext-ok';
      out.textContent=exAiCache[ck];
      return;
    }
  } else {
    // ② 文本资料：走本地出题库 / 缓存 / 复用进行中的请求
    return knowExtendGenText(out);
  }
  // ③ 未命中的词条：走联网 AI（云端直连 / 自建中继）
  let sysC, usrC;
  sysC='你是初中英语老师，为学生制作例句。要求：① 一次给 3 个例句，必须由浅入深（第1句最短最基础，第2句贴近日常，第3句稍长或含常见搭配/时态变化）；② 若该词条有形态变化，先单独一行列出全部形态（动词：原形/第三人称单数/过去式/过去分词/现在分词），并让例句尽量体现不同形态；③ 每句英文下一行紧跟中文翻译；④ 最后用一行说明用法要点或易错点。不要任何多余文字。';
  usrC='词条：'+word+'\n（若英文有粘连或夹杂中文释义、词性标注，请先还原成正确英文，再举例。）';
  out.className='know-ext-out'; out.textContent='未收录，正在联网生成…';
  try{
    const text=await aiComplete([{role:'system', content:sysC},{role:'user', content:usrC}]);
    const clean=plainify(String(text||'').trim()||'(未返回内容)');
    exAiCache[knowExtendKeyItem(item)]=clean;
    out.className='know-ext-out know-ext-ok';
    out.textContent=clean;
  }catch(e){
    out.className='know-ext-out know-ext-fallback';
    out.textContent= fallbackExtend(word);
  }
}
